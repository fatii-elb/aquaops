<div class="fixed inset-0 z-[60] flex justify-end">
  <div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-[2px]" (click)="cancelled.emit()" aria-hidden="true"></div>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate role="dialog" aria-modal="true" aria-labelledby="threshold-title" data-testid="threshold-form"
    class="relative flex h-full w-full max-w-md flex-col bg-surface-container-lowest shadow-2xl">
    <header class="flex items-start justify-between gap-space-md bg-surface-container-low px-space-2xl py-space-xl">
      <div class="flex min-w-0 items-center gap-space-md">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-primary text-on-primary shadow-sm">
          <span class="material-symbols-outlined text-[24px]">tune</span>
        </span>
        <div class="min-w-0">
          <p class="font-label-sm text-label-sm font-bold uppercase tracking-widest text-secondary">Seuils de détection</p>
          <h2 id="threshold-title" class="truncate font-headline-md text-headline-md text-on-surface">{{ zoneName() }}</h2>
        </div>
      </div>
      <button type="button" (click)="cancelled.emit()" aria-label="Fermer le formulaire"
        class="rounded-lg p-space-xs text-on-surface-variant transition-colors hover:bg-surface-container-high hover:text-on-surface">
        <span class="material-symbols-outlined text-[22px]">close</span>
      </button>
    </header>

    <div class="flex flex-1 flex-col gap-space-lg overflow-y-auto px-space-2xl py-space-xl">
      @if (formError(); as message) {
        <div role="alert" data-testid="form-error" class="flex items-start gap-space-sm rounded-lg bg-error-container px-space-md py-space-sm text-on-error-container">
          <span class="material-symbols-outlined mt-px text-[18px]">error</span>
          <p class="font-body-md text-body-md">{{ message }}</p>
        </div>
      }

      @for (f of fields; track f.key) {
        <label class="flex flex-col gap-space-xs">
          <span class="font-label-sm text-label-sm font-bold uppercase tracking-wider text-secondary">
            {{ f.label }}@if (f.unit) { <span class="font-normal normal-case"> ({{ f.unit }})</span> }
          </span>
          <input type="number" [formControlName]="f.key" [attr.min]="f.min" [attr.max]="f.max" [attr.step]="f.step"
            [attr.data-field]="f.key" [attr.aria-invalid]="errorOf(f.key) ? 'true' : null"
            class="w-full rounded-lg bg-surface-container-low px-space-md py-space-sm font-mono-telemetry text-mono-telemetry text-on-surface outline-none focus:ring-1 focus:ring-primary" />
          <span class="font-label-sm text-label-sm text-secondary">{{ f.help }}</span>
          @if (errorOf(f.key); as msg) {
            <span class="font-label-sm text-label-sm text-error" [attr.data-error]="f.key">{{ msg }}</span>
          }
        </label>
      }
    </div>

    <footer class="flex justify-end gap-space-sm bg-surface-container-low px-space-2xl py-space-lg">
      <button type="button" data-testid="form-cancel" (click)="cancelled.emit()"
        class="rounded-lg bg-surface-container-lowest px-space-lg py-space-sm font-label-md text-label-md text-on-surface shadow-sm transition-colors hover:bg-surface-container">
        Annuler
      </button>
      <button type="submit" data-testid="form-submit" [disabled]="saving()"
        class="flex items-center gap-space-xs rounded-lg bg-linear-to-r from-primary to-primary-container px-space-lg py-space-sm font-label-md text-label-md text-on-primary shadow-sm transition-all hover:brightness-105 active:scale-[0.98] disabled:opacity-60">
        <span class="material-symbols-outlined text-[18px] {{ saving() ? 'animate-spin' : '' }}">{{ saving() ? 'progress_activity' : 'check' }}</span>
        {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
    </footer>
  </form>
</div>
