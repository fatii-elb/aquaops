# =============================================================================
# AquaOps: NetworkPolicies (NFR-17, SCRUM-64)
# =============================================================================
# Isole les flux réseau pour que chaque service ne puisse parler qu'à ceux
# dont il a besoin (principe du moindre privilège).
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: aquaops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 1. Base de données PostgreSQL : n'accepte que les requêtes des services qui l'utilisent
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: aquaops
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["assets", "telemetry", "incidents", "notifications"]
      ports:
        - protocol: TCP
          port: 5432
---
# 2. Kafka : accepte la télémétrie, le simulateur, la détection, les incidents, les notifications
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ingress
  namespace: aquaops
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["telemetry", "simulator", "detection", "incidents", "notifications"]
      ports:
        - protocol: TCP
          port: 9092
---
# 3. Keycloak : accepte uniquement la passerelle et le service d'audit (assets)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-ingress
  namespace: aquaops
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["gateway", "assets"]
      ports:
        - protocol: TCP
          port: 8180
---
# 4. Passerelle (Gateway) : reçoit le trafic externe et redirige vers les services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: aquaops
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# 5. Autoriser les services à communiquer avec la passerelle (Egress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-gateway
  namespace: aquaops
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["telemetry", "assets", "detection", "incidents", "notifications"]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8080
---
# 6. Autoriser les services à communiquer avec Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-kafka
  namespace: aquaops
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["telemetry", "simulator", "detection", "incidents", "notifications"]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
---
# 7. Autoriser les services à communiquer avec PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
  namespace: aquaops
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["assets", "telemetry", "incidents", "notifications"]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# 8. Autoriser les services à interroger Eureka (pour la découverte)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-eureka
  namespace: aquaops
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["telemetry", "assets", "detection", "incidents", "notifications", "gateway"]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: eureka
      ports:
        - protocol: TCP
          port: 8761