global:
  scrape_interval: 15s

# La gateway (port 8080) n'est volontairement pas scrapée :
# son MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE est forcé à "health"
# (choix E5, compose.yml:134 / services.tf:118). Voir message à E5.
# Les autres services exposent /actuator/prometheus sur leur port applicatif.

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aquaops-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'telemetry:8081'
          - 'assets:8082'
          - 'detection:8083'
          - 'incidents:8084'
          - 'notifications:8085'
          # - 'gateway:8080'   # en attente décision E5 (management port 8090 ou non)
