global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aquaops-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: 
          - 'gateway:8080'
          - 'telemetry:8080'
          - 'assets:8080'
          - 'incidents:8080'
          - 'detection:8080'
          - 'notifications:8080'
