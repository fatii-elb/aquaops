# =============================================================================
# AquaOps: TEST environment, OPTIONAL infrastructure layer.
# Card SCRUM-55 / NFR-08 · E5
#
# Only for the case "PostgreSQL, Kafka and Keycloak run in Docker on the same
# VM". Always used together with compose.yml, never alone:
#     docker compose -f deploy/test/compose.yml -f deploy/test/compose.infra.yml up -d
# Compose merges the two files into one project (aquaops-test). Relative paths
# below are resolved from deploy/test/, the folder of the first file.
#
# Same images and settings as deploy/integration/ (already tested), except:
# no host port for PostgreSQL or Kafka, one internal Kafka listener only.
# TEST ONLY: Keycloak runs in start-dev mode (HTTP, in-container database,
# users created by hand are lost when the container is recreated).
# =============================================================================

services:

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required, see deploy/test/.env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see deploy/test/.env.example}
    volumes:
      - pgdata:/var/lib/postgresql               # PostgreSQL 18 mount point
      # Creates the 4 databases on the first start of an empty volume.
      - ../integration/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # no ports: reachable only by the services, as postgres:5432

  # Creates every service database that is MISSING, on a new or an EXISTING
  # volume: the init script above runs only on an empty volume and does not
  # create aquaops_detection (added by PR #116). Idempotent: an existing
  # database is left as it is, nothing is ever dropped. Runs at each "up",
  # exits 0, then stays stopped. Same logic as the k3s Job (databases.tf).
  postgres-databases:
    image: postgres:18.6
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:?DB_USER is required, see deploy/test/.env.example}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see deploy/test/.env.example}
    command:
      - sh
      - -ec
      - |
        for db in aquaops_assets aquaops_detection aquaops_incidents aquaops_notifications aquaops_telemetry; do
          if [ "$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$$db'")" = 1 ]; then
            echo "$$db: exists"
          else
            psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$db\" OWNER \"$$PGUSER\""
            echo "$$db: created"
          fi
        done
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # One listener for the containers (kafka:9092), one for KRaft itself.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Broker heap (default 1 GB). 512 MB is plenty for this test load and
      # leaves room for the 7 services, Keycloak and PostgreSQL on an 8 GB VM.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks: [backend]
    healthcheck:
      # A real broker request (ApiVersions), kept. The client starts a JVM on
      # every probe: small heap, 30 s timeout, one probe every 15 s, 60 s grace
      # period. On the 8 GB test VM it took more than the old 10 s timeout.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    # no ports: reachable only by the services, as kafka:9092

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --http-port=8180 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required, see deploy/test/.env.example}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required, see deploy/test/.env.example}
      KC_HEALTH_ENABLED: "true"       # /health/ready on the management port 9000
      # Read by the realm import (client "aquaops-audit"): without it the secret would be the literal placeholder.
      KEYCLOAK_AUDIT_CLIENT_SECRET: ${KEYCLOAK_AUDIT_CLIENT_SECRET:?KEYCLOAK_AUDIT_CLIENT_SECRET is required, see deploy/test/.env.example}
    volumes:
      - ../../docs/keycloak:/opt/keycloak/data/import:ro   # realm export (E2), read only
    networks: [backend]
    # 127.0.0.1 by default (admin console through an SSH tunnel). Browsers
    # will need it once the frontend exists: decision for E2 and the VM admin.
    ports:
      - "${KEYCLOAK_BIND:-127.0.0.1}:${KEYCLOAK_HOST_PORT:-8180}:8180"
    healthcheck:
      # The image has bash but no curl: plain HTTP request through /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # The services wait for the infrastructure they use (merged into compose.yml).
  telemetry:
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
  assets:
    environment:
      # Login audit (FR-24): assets-service copies Keycloak login events into audit_log.
      AUDIT_KEYCLOAK_ENABLED: "true"
      KEYCLOAK_BASE_URL: http://keycloak:8180
      KEYCLOAK_AUDIT_CLIENT_SECRET: ${KEYCLOAK_AUDIT_CLIENT_SECRET:?KEYCLOAK_AUDIT_CLIENT_SECRET is required, see deploy/test/.env.example}
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
  detection:
    depends_on:
      postgres-databases: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
  incidents:
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
  notifications:
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
  simulator:
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  pgdata:
  kafkadata:
