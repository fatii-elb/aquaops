# Protege la disponibilite pendant les operations volontaires (vidange d'un noeud) : un pod au moins reste en service.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: detection-service
  namespace: aquaops
  labels:
    app.kubernetes.io/name: detection-service
    app.kubernetes.io/part-of: aquaops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detection-service
