# NFR-05 : service télémétrie, sondes Actuator, mise à jour sans coupure.
# Le HPA NFR-04 (E1) gère les réplicas, de 2 à 6 : ne pas fixer spec.replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
  namespace: aquaops
  labels: { app: telemetry }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: telemetry }
  template:
    metadata:
      labels: { app: telemetry }
    spec:
      terminationGracePeriodSeconds: 40   # > timeout-per-shutdown-phase (20 s)
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: telemetry
          image: ghcr.io/fatii-elb/aquaops/telemetry:IMAGE_TAG
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - { name: TELEMETRY_PORT, value: "8081" }
            - { name: HEALTHCHECK_PORT, value: "8081" }
            - { name: TELEMETRY_DB_URL, value: "jdbc:postgresql://postgres:5432/aquaops_telemetry" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - { name: EUREKA_ENABLED, value: "true" }
            - { name: EUREKA_URL, value: "http://eureka:8761/eureka" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: aquaops-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: aquaops-db, key: DB_PASSWORD } }
          resources:
            # requests obligatoires pour que le HPA calcule l'utilisation CPU.
            # 500m / 2 CPU : à 200m / 1, le démarrage de la JVM (≈ 36 s de CPU) était bridé 96 % du temps,
            # 102-114 s sous charge, et RC-05 échouait ; à 500m / 2 : 22 s à vide, 28-38 s sous charge,
            # RC-05 réussi (k3s jetable, 24/11/2026 : 31 s, 0 perte). Le HPA vise 70 % de 500m (350m).
            # PRÉREQUIS : quota rc11 relevé AVANT (feature/SCRUM-56-rc11-quota-telemetry-cpu, 5200m / 29).
            requests: { cpu: 500m, memory: 384Mi }
            limits: { cpu: "2", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
