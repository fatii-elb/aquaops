apiVersion: v1
kind: Service
metadata:
  name: telemetry
  namespace: aquaops
  labels: { app: telemetry }
spec:
  selector: { app: telemetry }
  ports:
    - { name: http, port: 8081, targetPort: http }
---
# Au plus un pod volontairement indisponible à la fois.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: telemetry
  namespace: aquaops
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: telemetry }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telemetry
  namespace: aquaops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telemetry
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
