# NFR-14 : TLS 1.2 minimum et chiffrements AEAD seulement (supprime les chiffrements CBC signalés LUCKY13 par testssl.sh).
# TLS 1.3 n'est pas concerné par cipherSuites : ses suites sont déjà toutes AEAD.
# Version de l'API : traefik.io/v1alpha1 pour Traefik 3 (k3s 1.31 et plus).
# Pour un k3s plus ancien (Traefik 2), remplacer par traefik.containo.us/v1alpha1.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: aquaops-tls-options
  namespace: aquaops
spec:
  minVersion: VersionTLS12
  cipherSuites:
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  sniStrict: true
