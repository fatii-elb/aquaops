# =============================================================================
# AquaOps: OPTIONAL Eureka overlay for the integration stack.
# Card [TECH] Eureka et routage Gateway · E5
#
# Never used unless named with -f. From the repository root:
#     docker compose -f deploy/integration/docker-compose.integration.yml \
#                    -f deploy/integration/compose.eureka.yml up -d --build
#
# Adds the Eureka server and switches the gateway to Eureka routing
# (profile "eureka"). Eureka clients are enabled for assets-service,
# telemetry-service and simulator; other services keep fixed addresses until
# they get a client.
# Back to the Sprint 4 routing: run the base file alone.
# =============================================================================

services:

  eureka:
    image: aquaops/eureka-server:dev
    pull_policy: never            # local image only, built from the repository
    build:
      context: ../../services/eureka-server
      dockerfile: ../../deploy/docker/spring-service.Dockerfile
    environment:
      HEALTHCHECK_PORT: "8761"
      EUREKA_HOSTNAME: eureka
    # No host port: the registry has no authentication. Dashboard, if needed:
    #     docker compose ... exec gateway curl -s http://eureka:8761/eureka/apps
    restart: unless-stopped

  gateway:
    environment:
      SPRING_PROFILES_ACTIVE: eureka
      EUREKA_URL: http://eureka:8761/eureka
      ASSETS_URL: lb://assets-service
      TELEMETRY_URL: lb://telemetry-service
      SIMULATOR_URL: lb://simulator

  assets:
    environment:
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://eureka:8761/eureka

  telemetry:
    environment:
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://eureka:8761/eureka

  simulator:
    environment:
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://eureka:8761/eureka
