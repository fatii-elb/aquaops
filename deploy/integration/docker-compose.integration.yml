# =============================================================================
# AquaOps: ISOLATED integration stack (infrastructure + 7 Java services)
# Card [TECH] deployment · E5
#
# Local integration testing only, separate from deploy/docker-compose.yml:
# other project name, no container_name, own network and volumes, host ports
# bound to 127.0.0.1 and different from the dev stack (8080, 8180, 9092).
#
# From the repository root:
#     cp deploy/integration/.env.example deploy/integration/.env   # then edit it
#     docker compose -f deploy/integration/docker-compose.integration.yml up -d
#
# Published on the host (127.0.0.1 only):
#     gateway  ${INTEGRATION_GATEWAY_PORT:-18080}   single API entry point
#     keycloak ${INTEGRATION_KEYCLOAK_PORT:-18180}  admin console, tokens
#     kafka    ${INTEGRATION_KAFKA_PORT:-19092}     host listener (debugging)
# Everything else is reachable only inside the Docker network.
#
# KNOWN BLOCKER (owned by E2 / E4, not changed here):
#   Tokens carry the issuer of the URL used to get them. Through the host port
#   that is http://localhost:18180/realms/aquaops, but assets-service runs in
#   a container and reaches Keycloak as http://keycloak:8180. The two do not
#   match, so assets rejects such tokens (401). The realm also only allows
#   redirects to http://localhost:4200. Needs a single issuer URL (KC_HOSTNAME
#   or a reverse proxy) agreed with E2, and a configurable issuer in Angular (E4).
# =============================================================================

name: aquaops-integration

# Settings shared by the 7 Java services (YAML anchors).
x-java-service: &java-service
  pull_policy: never            # local images only, never pulled from Docker Hub
  restart: unless-stopped
  build: &java-build
    dockerfile: ../../deploy/docker/spring-service.Dockerfile

x-db-credentials: &db-credentials
  DB_USER: ${DB_USER:?DB_USER is required, see .env.example}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required, see .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql               # PostgreSQL 18 mount point
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # no ports: internal only

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:${INTEGRATION_KAFKA_PORT:-19092}:${INTEGRATION_KAFKA_PORT:-19092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: containers (kafka:29092). EXTERNAL: host. CONTROLLER: KRaft only.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:${INTEGRATION_KAFKA_PORT:-19092},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${INTEGRATION_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --http-port=8180 --import-realm
    ports:
      - "127.0.0.1:${INTEGRATION_KEYCLOAK_PORT:-18180}:8180"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required, see .env.example}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required, see .env.example}
      KC_HEALTH_ENABLED: "true"       # /health/ready on the management port 9000
    volumes:
      - ../../docs/keycloak:/opt/keycloak/data/import:ro   # realm export (E2), read only
    healthcheck:
      # The image has bash but no curl: plain HTTP request through /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    # start-dev keeps users inside the container: lost on "down" (no volume).

  # ---------------------------------------------------------------------------
  # Java services: images built from deploy/docker/spring-service.Dockerfile.
  # No ports: reached through the gateway only. Variable names come from each
  # service's application.yml / application.properties.
  # ---------------------------------------------------------------------------
  telemetry:
    <<: *java-service
    image: aquaops/telemetry:dev
    build: { <<: *java-build, context: ../../services/telemetry-service }
    environment:
      <<: *db-credentials
      TELEMETRY_DB_URL: jdbc:postgresql://postgres:5432/aquaops_telemetry
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  assets:
    <<: *java-service
    image: aquaops/assets:dev
    build: { <<: *java-build, context: ../../services/assets-service }
    environment:
      <<: *db-credentials
      ASSETS_DB_URL: jdbc:postgresql://postgres:5432/aquaops_assets
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8180/realms/aquaops}
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  detection:
    <<: *java-service
    image: aquaops/detection:dev
    build: { <<: *java-build, context: ../../services/detection-service }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  incidents:
    <<: *java-service
    image: aquaops/incidents:dev
    build: { <<: *java-build, context: ../../services/incidents-service }
    environment:
      <<: *db-credentials
      INCIDENTS_DB_URL: jdbc:postgresql://postgres:5432/aquaops_incidents
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  notifications:
    <<: *java-service
    image: aquaops/notifications:dev
    build: { <<: *java-build, context: ../../services/notifications-service }
    environment:
      <<: *db-credentials
      NOTIFICATIONS_DB_URL: jdbc:postgresql://postgres:5432/aquaops_notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  simulator:
    <<: *java-service
    image: aquaops/simulator:dev
    build: { <<: *java-build, context: ../../services/simulator }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway:
    <<: *java-service
    image: aquaops/gateway:dev
    build: { <<: *java-build, context: ../../services/gateway }
    ports:
      - "127.0.0.1:${INTEGRATION_GATEWAY_PORT:-18080}:8080"
    environment:
      TELEMETRY_URL: http://telemetry:8081
      ASSETS_URL: http://assets:8082
      DETECTION_URL: http://detection:8083
      INCIDENTS_URL: http://incidents:8084
      NOTIFICATIONS_URL: http://notifications:8085
      SIMULATOR_URL: http://simulator:8086
    # No depends_on: routes are resolved per request, so the gateway starts
    # even if one backend is down (that backend then answers 5xx).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  pgdata:
  kafkadata:
