server:
  port: ${ASSETS_PORT:8082}
spring:
  application:
    name: assets-service
  datasource:
    url: ${ASSETS_DB_URL:jdbc:postgresql://localhost:5432/aquaops_assets}
    username: ${DB_USER:aquaops}
    password: ${DB_PASSWORD:aquaops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
