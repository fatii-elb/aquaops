server:
  port: ${ASSETS_PORT:8082}
  # Arret gracieux : les requetes en cours se terminent avant l'arret du pod (NFR-07, mise a jour sans coupure).
  shutdown: graceful
spring:
  application:
    name: assets-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${ASSETS_DB_URL:jdbc:postgresql://localhost:5432/aquaops_assets}
    username: ${DB_USER:aquaops}
    password: ${DB_PASSWORD:aquaops}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/aquaops}
management:
  endpoint:
    health:
      # /actuator/health/liveness et /actuator/health/readiness : sondes Kubernetes (NFR-05).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

# Eureka (exigence de l'enseignant). Desactive tant que EUREKA_URL n'est pas fourni :
# sans serveur Eureka, le service demarre normalement.
# Delais courts : un service arrete disparait du registre en moins de 45 s (NFR-05 : retablissement en 60 s).
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    # Dans Kubernetes chaque pod a sa propre adresse IP : on s'inscrit par IP, avec un identifiant unique par pod.
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
assets:
  audit:
    kafka:
      # false : ne pas lire incident-events (tests sans Kafka)
      enabled: ${ASSETS_AUDIT_KAFKA_ENABLED:true}
    keycloak:
      # Audit des connexions (FR-24) : copie les evenements de connexion de Keycloak dans audit_log.
      # Desactive par defaut (tests, developpement sans Keycloak). Le secret vient de l'environnement, jamais du depot.
      enabled: ${AUDIT_KEYCLOAK_ENABLED:false}
      # Adresse de Keycloak telle que le SERVICE la joint (reseau Docker : http://keycloak:8180).
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
      realm: aquaops
      client-id: aquaops-audit
      client-secret: ${KEYCLOAK_AUDIT_CLIENT_SECRET:}
      poll-delay-ms: 30000
      initial-delay-ms: 10000
