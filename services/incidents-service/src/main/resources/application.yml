server:
  port: ${INCIDENTS_PORT:8084}
spring:
  application:
    name: incidents-service
  datasource:
    url: ${INCIDENTS_DB_URL:jdbc:postgresql://localhost:5432/aquaops_incidents}
    username: ${DB_USER:aquaops}
    password: ${DB_PASSWORD:aquaops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health
