server:
  port: ${INCIDENTS_PORT:8084}
  # Arret gracieux : les requetes en cours se terminent avant l'arret du pod (NFR-05, NFR-07).
  shutdown: graceful
spring:
  application:
    name: incidents-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${INCIDENTS_DB_URL:jdbc:postgresql://localhost:5432/aquaops_incidents}
    username: ${DB_USER:aquaops}
    password: ${DB_PASSWORD:aquaops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoint:
    health:
      # /actuator/health/liveness et /actuator/health/readiness : sondes Kubernetes (NFR-05).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Eureka. Desactive tant que EUREKA_ENABLED n'est pas "true" : sans serveur, le service demarre normalement.
# Delais courts : un service arrete disparait du registre en moins de 45 s (NFR-05).
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    # Dans Kubernetes chaque pod a sa propre adresse IP : on s'inscrit par IP, avec un identifiant unique par pod.
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
