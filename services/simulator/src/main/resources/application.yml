server:
  port: ${SIMULATOR_PORT:8086}
  # Arret gracieux : les requetes en cours se terminent avant l'arret du pod (NFR-05, NFR-07).
  shutdown: graceful
spring:
  application:
    name: simulator
  lifecycle:
    timeout-per-shutdown-phase: 20s
simulator:
  sensors-file: ${SENSORS_FILE:classpath:sensors.json}
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  api-key: ${SIMULATOR_API_KEY:local-dev-only}
  interval-ms: ${SIM_INTERVAL_MS:1000}
  request-timeout: ${SIMULATOR_REQUEST_TIMEOUT:5s}
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
management:
  endpoint:
    health:
      # /actuator/health/liveness et /actuator/health/readiness : sondes Kubernetes (NFR-05).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
