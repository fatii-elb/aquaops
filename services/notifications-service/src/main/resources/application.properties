spring.datasource.url=${NOTIFICATIONS_DB_URL:jdbc:postgresql://localhost:5432/aquaops_notifications}
spring.datasource.username=${DB_USER:aquaops}
spring.datasource.password=${DB_PASSWORD:aquaops}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect