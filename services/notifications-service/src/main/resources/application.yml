server:
  port: ${NOTIFICATIONS_PORT:8085}
  # Arret gracieux : les requetes en cours se terminent avant l'arret du pod (NFR-05, NFR-07).
  shutdown: graceful
spring:
  application:
    name: notifications-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
management:
  endpoint:
    health:
      # /actuator/health/liveness et /actuator/health/readiness : sondes Kubernetes (NFR-05).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
eureka:
  client:
    # Exigence de l'enseignant : inscription dans Eureka. Desactive par defaut,
    # activer avec EUREKA_ENABLED=true (voir deploy/).
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
springdoc:
  api-docs:
    path: /api/notifications/v3/api-docs
  swagger-ui:
    path: /api/notifications/swagger-ui.html