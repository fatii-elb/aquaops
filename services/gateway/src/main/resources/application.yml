server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: telemetry
              uri: ${TELEMETRY_URL:http://localhost:8081}
              predicates:
                - Path=/api/telemetry/**

            - id: assets
              uri: ${ASSETS_URL:http://localhost:8082}
              predicates:
                - Path=/api/assets/**

            - id: detection
              uri: ${DETECTION_URL:http://localhost:8083}
              predicates:
                - Path=/api/detection/**

            - id: incidents
              uri: ${INCIDENTS_URL:http://localhost:8084}
              predicates:
                - Path=/api/incidents/**

            - id: notifications
              uri: ${NOTIFICATIONS_URL:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**

            - id: simulator
              uri: ${SIMULATOR_URL:http://localhost:8086}
              predicates:
                - Path=/api/simulator/**

management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,gateway
