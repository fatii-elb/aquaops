# Base en memoire pour les tests : la CI de detection n'a pas de PostgreSQL.
# Un nom unique par contexte Spring : les contextes en cache ne partagent pas leurs tables.
spring.datasource.url=jdbc:h2:mem:detection-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Pas de registre Eureka pendant les tests : le client ne tente ni inscription ni connexion.
eureka.client.enabled=false
