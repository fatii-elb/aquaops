
server:
  port: ${DETECTION_PORT:8083}
  # Arret gracieux : les requetes en cours se terminent avant l'arret du pod (NFR-05, NFR-07).
  shutdown: graceful

spring:
  application:
    name: detection-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

detection:
  kafka:
    sensor-topic: ${DETECTION_SENSOR_TOPIC:sensor-readings}
    anomaly-topic: ${DETECTION_ANOMALY_TOPIC:anomaly-detected}
    consumer-group: ${DETECTION_CONSUMER_GROUP:detection-service}

  leak:
    min-pressure: ${LEAK_MIN_PRESSURE:2.0}
    max-flow: ${LEAK_MAX_FLOW:40.0}
    duration-seconds: ${LEAK_DURATION_SECONDS:10}

  silence:
  threshold-seconds: ${SILENCE_THRESHOLD_SECONDS:10}
  check-interval-ms: ${SILENCE_CHECK_INTERVAL_MS:1000}
  
management:
  endpoint:
    health:
      # /actuator/health/liveness et /actuator/health/readiness : sondes Kubernetes (NFR-05).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
