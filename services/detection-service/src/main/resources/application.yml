
server:
  port: ${DETECTION_PORT:8083}
  # Arret gracieux : les requetes en cours se terminent avant l'arret du pod (NFR-05, NFR-07).
  shutdown: graceful

spring:
  application:
    name: detection-service
  datasource:
    url: ${DETECTION_DB_URL:jdbc:postgresql://localhost:5432/aquaops_detection}
    username: ${DB_USER:aquaops}
    password: ${DB_PASSWORD:aquaops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/aquaops}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

detection:
  kafka:
    sensor-topic: ${DETECTION_SENSOR_TOPIC:sensor-readings}
    anomaly-topic: ${DETECTION_ANOMALY_TOPIC:anomaly-detected}
    consumer-group: ${DETECTION_CONSUMER_GROUP:detection-service}

  leak:
    min-pressure: ${LEAK_MIN_PRESSURE:2.0}
    max-flow: ${LEAK_MAX_FLOW:40.0}
    duration-seconds: ${LEAK_DURATION_SECONDS:10}

  thresholds:
    refresh-ms: ${THRESHOLDS_REFRESH_MS:15000}
    defaults:
      tank-min-level: ${TANK_MIN_LEVEL:2.0}

  silence:
    threshold-seconds: ${SILENCE_THRESHOLD_SECONDS:10}
    check-interval-ms: ${SILENCE_CHECK_INTERVAL_MS:1000}
  
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:${spring.cloud.client.hostname:localhost}}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  metrics:
    tags:
      application: detection-service
  health:
    eureka:
      enabled: false
    discoveryComposite:
      enabled: false
  endpoint:
    health:
      # /actuator/health/liveness et /actuator/health/readiness : sondes Kubernetes (NFR-05).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
