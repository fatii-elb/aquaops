
server:
  port: ${DETECTION_PORT:8083}

spring:
  application:
    name: detection-service
  datasource:
    url: ${DETECTION_DB_URL:jdbc:postgresql://localhost:5432/aquaops_detection}
    username: ${DB_USER:aquaops}
    password: ${DB_PASSWORD:aquaops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/aquaops}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

detection:
  kafka:
    sensor-topic: ${DETECTION_SENSOR_TOPIC:sensor-readings}
    anomaly-topic: ${DETECTION_ANOMALY_TOPIC:anomaly-detected}
    consumer-group: ${DETECTION_CONSUMER_GROUP:detection-service}

  leak:
    min-pressure: ${LEAK_MIN_PRESSURE:2.0}
    max-flow: ${LEAK_MAX_FLOW:40.0}
    duration-seconds: ${LEAK_DURATION_SECONDS:10}

  silence:
  threshold-seconds: ${SILENCE_THRESHOLD_SECONDS:10}
  check-interval-ms: ${SILENCE_CHECK_INTERVAL_MS:1000}
  
management:
  endpoints:
    web:
      exposure:
        include: health
