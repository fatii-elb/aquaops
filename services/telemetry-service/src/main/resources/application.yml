server:
  port: ${TELEMETRY_PORT:8081}
  # Arret gracieux : la mesure en cours est enregistree avant l'arret du pod (NFR-05, NFR-07).
  shutdown: graceful
spring:
  application:
    name: telemetry-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${TELEMETRY_DB_URL:jdbc:postgresql://localhost:5432/aquaops_telemetry}
    username: ${DB_USER:aquaops}
    password: ${DB_PASSWORD:aquaops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # NFR-05 : l'offset n'est valide qu'apres le traitement du lot (jamais avant), donc une mesure n'est jamais perdue
      # (au pire elle est relue : le doublon est ignore, voir ReadingMeasureSink).
      enable-auto-commit: false
      # Un nouveau groupe relit tout le topic plutot que de sauter des mesures.
      auto-offset-reset: earliest
      properties:
        # Un pod tue sans prevenir est declare mort apres 15 s : un autre pod reprend la partition.
        session.timeout.ms: 15000
        heartbeat.interval.ms: 5000
    listener:
      ack-mode: batch
management:
  endpoint:
    health:
      # /actuator/health/liveness et /actuator/health/readiness : sondes Kubernetes (NFR-05).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
