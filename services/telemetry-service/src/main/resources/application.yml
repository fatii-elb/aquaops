server:
  port: ${TELEMETRY_PORT:8081}
spring:
  application:
    name: telemetry-service
  datasource:
    url: ${TELEMETRY_DB_URL:jdbc:postgresql://localhost:5432/aquaops_telemetry}
    username: ${DB_USER:aquaops}
    password: ${DB_PASSWORD:aquaops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health
