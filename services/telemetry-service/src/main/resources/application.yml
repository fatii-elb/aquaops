server:
  port: ${TELEMETRY_PORT:8081}
  # Arret gracieux : la mesure en cours est enregistree avant l'arret du pod (NFR-05, NFR-07).
  shutdown: graceful
spring:
  application:
    name: telemetry-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${TELEMETRY_DB_URL:jdbc:postgresql://localhost:5432/aquaops_telemetry}
    username: ${DB_USER:aquaops}
    password: ${DB_PASSWORD:aquaops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoint:
    health:
      # /actuator/health/liveness et /actuator/health/readiness : sondes Kubernetes (NFR-05).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
