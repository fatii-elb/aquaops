# Gitleaks : bloque toute PR qui contient un secret. Carte SCRUM-62 / NFR-15 · E3
name: Gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Appelable par le workflow Images (publish.yml, E5) : aucune image n'est
  # construite si ce scan echoue sur le meme commit. Appele depuis un push sur
  # main, github.event_name vaut "push" : le scan porte sur before..after.
  # Appele depuis un lancement manuel d'Images (workflow_dispatch), il n'y a
  # pas de "before" : tout l'historique est analyse.
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the repository
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks detect --source . --config .gitleaks.toml --redact -v --log-opts="${PR_BASE}..${PR_HEAD}"
          elif [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            ./gitleaks detect --source . --config .gitleaks.toml --redact -v --log-opts="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # No usable "before" commit: manual run of the Images workflow
            # (workflow_dispatch) or first push of a branch. "..<sha>" would
            # scan 0 commits and pass: scan the whole history instead.
            echo "No previous commit for event $EVENT: scanning the whole history"
            ./gitleaks detect --source . --config .gitleaks.toml --redact -v
          fi
