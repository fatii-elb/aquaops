# =============================================================================
# AquaOps image pipeline on main: test the exact commit, then build the images.
# Card SCRUM-55 / NFR-08 · E5
#
# Publication to GHCR is prepared but OFF (GHCR_PUBLISH below). It can only be
# switched "on" once Trivy blocks CRITICAL vulnerabilities (TRIVY_EXIT_CODE
# '1', decision of E4): the "publish-policy" job refuses otherwise.
#
#   push to main (commit S)
#     ci           the CI workflow (ci.yml) on S: Java, PostgreSQL, Angular
#     gitleaks     the Gitleaks workflow (gitleaks.yml, E3) on S, in parallel
#                  with ci: the security gate, no image is built without it
#     build-java   needs ci AND gitleaks; 7 images, one job each, all from the
#                  shared Dockerfile; skipped if CI or Gitleaks did not succeed
#     images       single result: green only if CI, Gitleaks and all builds are
#
#     build-frontend  the Angular image (frontend/Dockerfile, E4), same checks
#
#     publish-policy  reads GHCR_PUBLISH: off | dry-run | on ("on" refused
#                     while Trivy is audit-only)
#     publish      only if CI, Gitleaks, the 8 builds and their scans all
#                  succeeded: reloads the 8 SCANNED images (no rebuild), checks
#                  they are identical, then (mode "on") pushes them with their
#                  full-SHA tag. The only job with packages: write.
#
# Trivy (SCRUM-63 / NFR-16, E4): each image is loaded into the job and scanned
# before anything could be pushed. AUDIT MODE for now (TRIVY_EXIT_CODE below):
# reports only, no failure.
# Accepted exceptions: deploy/trivy/.trivyignore (one line + reason each).
# Actions are pinned to a commit SHA; the comment gives the release tag.
# =============================================================================

name: Images

on:
  push:
    branches: [main]

permissions:
  contents: read

# One group per commit: two merges never cancel each other. The name must
# not start with "ci-tests-" (the group used by ci.yml when called here).
concurrency:
  group: images-main-${{ github.sha }}
  cancel-in-progress: false

env:
  # Future registry path (lowercase, as GHCR requires). Only used as a local
  # tag while push is false.
  IMAGE_NAMESPACE: ghcr.io/fatii-elb/aquaops
  # Trivy mode (SCRUM-63): '0' = audit, reports only, never blocks the pipeline;
  # '1' = enforce, a CRITICAL vulnerability fails the job (NFR-16 target).
  # Switch to '1' once the images are clean.
  TRIVY_EXIT_CODE: '0'
  # GHCR publication (SCRUM-55 / NFR-08, E5):
  #   'off'     nothing is exported or published (current setting)
  #   'dry-run' the 8 scanned images go through the whole publish path
  #             (export, reload, identity check) WITHOUT any registry login
  #             or push: measures the extra time, publishes nothing
  #   'on'      the same, then pushes ghcr.io/...:<full SHA>. Refused while
  #             TRIVY_EXIT_CODE is not '1'. Never a "latest" tag.
  GHCR_PUBLISH: 'off'

jobs:

  # ---------------------------------------------------------------------------
  # Same tests as pull requests, on the exact commit that reached main.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Secret scan of the same push (E3's workflow and .gitleaks.toml, reused as
  # is). Runs in parallel with CI: it adds no time to the pipeline.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks
    uses: ./.github/workflows/gitleaks.yml

  # ---------------------------------------------------------------------------
  # One job per Java service. Build context = the service folder; Dockerfile
  # and its .dockerignore come from deploy/docker/.
  # needs: a failed, cancelled or skipped CI or Gitleaks skips every build.
  # ---------------------------------------------------------------------------
  build-java:
    name: Build ${{ matrix.image }}
    needs: [ci, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false            # one broken image does not hide the others
      matrix:
        include:
          - { image: gateway,       service: gateway }
          - { image: telemetry,     service: telemetry-service }
          - { image: assets,        service: assets-service }
          - { image: detection,     service: detection-service }
          - { image: incidents,     service: incidents-service }
          - { image: notifications, service: notifications-service }
          - { image: simulator,     service: simulator }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # push: false, load: true: the image is loaded into this job's Docker so
      # Trivy can scan it before any push (SCRUM-63).
      # Cache: per-image scope, so the 7 services never overwrite each other.
      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: services/${{ matrix.service }}
          file: deploy/docker/spring-service.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=aquaops-${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=java-${{ matrix.image }}
          cache-to: type=gha,scope=java-${{ matrix.image }},mode=max

      # AUDIT (SCRUM-63): the report lists CRITICAL and HIGH and never blocks.
      - name: Trivy report (CRITICAL + HIGH, never blocks)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: deploy/trivy/.trivyignore
          output: trivy-${{ matrix.image }}.txt

      - name: Trivy report (summary)
        if: always()
        run: |
          {
            echo "### Trivy: ${{ matrix.image }}"
            echo '```'
            head -c 60000 "trivy-${{ matrix.image }}.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy report (download)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.txt
          if-no-files-found: warn
          retention-days: 14

      # The gate: CRITICAL fails the job only when TRIVY_EXIT_CODE is '1'.
      - name: Trivy gate (CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          ignore-unfixed: true
          trivyignores: deploy/trivy/.trivyignore

      # GHCR (E5): hand the image Trivy just scanned to the publish job, with
      # its identity (image ID + layers). After the gate: a failed scan stops
      # the job before this step. Skipped entirely while GHCR_PUBLISH is off.
      - name: Export scanned image
        if: env.GHCR_PUBLISH != 'off'
        env:
          REF: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p image-export
          docker image inspect --format '{{.Id}} {{json .RootFS.Layers}}' "$REF" > "image-export/$IMAGE.id"
          printf '%s\n' "$REF" > "image-export/$IMAGE.ref"
          docker save -o "image-export/$IMAGE.tar" "$REF"
          ls -l image-export

      - name: Upload scanned image
        if: env.GHCR_PUBLISH != 'off'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: image-export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

      - name: Summary
        env:
          TAG: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
        # A Markdown table needs its header row, or GitHub shows raw pipes.
        run: |
          {
            echo "| Image | Result |"
            echo "| --- | --- |"
            echo "| \`$TAG\` | built, not pushed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Angular image: context = frontend/, its own Dockerfile (nginx). Addresses
  # (Keycloak, gateway) are read at container start: nothing to build per
  # environment. Same Trivy rule as the Java images.
  # Same gate as the Java images: CI and Gitleaks must both succeed.
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build frontend
    needs: [ci, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=aquaops-frontend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # AUDIT (SCRUM-63): the report lists CRITICAL and HIGH and never blocks.
      - name: Trivy report (CRITICAL + HIGH, never blocks)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: deploy/trivy/.trivyignore
          output: trivy-frontend.txt

      - name: Trivy report (summary)
        if: always()
        run: |
          {
            echo "### Trivy: frontend"
            echo '```'
            head -c 60000 "trivy-frontend.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy report (download)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: trivy-frontend
          path: trivy-frontend.txt
          if-no-files-found: warn
          retention-days: 14

      # The gate: CRITICAL fails the job only when TRIVY_EXIT_CODE is '1'.
      - name: Trivy gate (CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          ignore-unfixed: true
          trivyignores: deploy/trivy/.trivyignore

      # GHCR (E5): same export as the Java images, after the Trivy gate.
      - name: Export scanned image
        if: env.GHCR_PUBLISH != 'off'
        env:
          REF: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          IMAGE: frontend
        run: |
          mkdir -p image-export
          docker image inspect --format '{{.Id}} {{json .RootFS.Layers}}' "$REF" > "image-export/$IMAGE.id"
          printf '%s\n' "$REF" > "image-export/$IMAGE.ref"
          docker save -o "image-export/$IMAGE.tar" "$REF"
          ls -l image-export

      - name: Upload scanned image
        if: env.GHCR_PUBLISH != 'off'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-frontend
          path: image-export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

      - name: Summary
        env:
          TAG: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
        run: |
          {
            echo "| Image | Result |"
            echo "| --- | --- |"
            echo "| \`$TAG\` | built, scanned, not pushed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # GHCR switch, checked against the Trivy policy. No token needed at all.
  # "on" while Trivy is audit-only is refused: it fails here (and therefore
  # "Images result") instead of publishing unblocked images.
  # ---------------------------------------------------------------------------
  publish-policy:
    name: Publish policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
    steps:
      - name: Check GHCR_PUBLISH against TRIVY_EXIT_CODE
        id: policy
        run: |
          case "$GHCR_PUBLISH" in
            off|dry-run)
              mode="$GHCR_PUBLISH" ;;
            on)
              if [ "$TRIVY_EXIT_CODE" != "1" ]; then
                echo "::error::GHCR_PUBLISH=on refused: Trivy is audit-only (TRIVY_EXIT_CODE=$TRIVY_EXIT_CODE). Blocking must be enabled first (E4)."
                exit 1
              fi
              mode=on ;;
            *)
              echo "::error::GHCR_PUBLISH must be off, dry-run or on, got [$GHCR_PUBLISH]"
              exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "GHCR publication mode: $mode (TRIVY_EXIT_CODE=$TRIVY_EXIT_CODE)"

  # ---------------------------------------------------------------------------
  # Publication of the 8 SCANNED images. No checkout, no rebuild, no scanner:
  # only our shell and the official artifact action run with packages: write.
  # No "if" status function: runs only if EVERY job in needs succeeded (CI,
  # Gitleaks, the 7 Java builds, the frontend build and their Trivy gates).
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to GHCR (${{ needs.publish-policy.outputs.mode }})
    needs: [ci, gitleaks, build-java, build-frontend, publish-policy]
    if: needs.publish-policy.outputs.mode == 'dry-run' || needs.publish-policy.outputs.mode == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      packages: write
    env:
      IMAGES: gateway telemetry assets detection incidents notifications simulator frontend
      SHA: ${{ github.sha }}
    steps:
      # Same run only. v8 fails on any digest mismatch of the artifact.
      - name: Download the scanned images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-*
          path: images
          merge-multiple: true

      # The image about to be published must be the one Trivy scanned: same
      # reference, same image ID and layers, revision label = this commit.
      - name: Reload and verify image identity
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit SHA: $SHA"; exit 1; }
          for img in $IMAGES; do
            ref="$IMAGE_NAMESPACE/$img:$SHA"
            for f in tar id ref; do
              [ -f "images/$img.$f" ] || { echo "::error::$img: scanned image missing ($img.$f)"; exit 1; }
            done
            [ "$(cat "images/$img.ref")" = "$ref" ] || { echo "::error::$img: unexpected reference"; exit 1; }
            docker load -i "images/$img.tar" > /dev/null
            rm -f "images/$img.tar"
            actual="$(docker image inspect --format '{{.Id}} {{json .RootFS.Layers}}' "$ref")"
            [ "$actual" = "$(cat "images/$img.id")" ] \
              || { echo "::error::$img: the reloaded image differs from the scanned one"; exit 1; }
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ref")"
            [ "$revision" = "$SHA" ] || { echo "::error::$img: revision label [$revision] is not $SHA"; exit 1; }
            echo "$img: identical to the scanned image ($ref)"
          done

      # Mode "on" only, and checked again here (defence in depth). Short-lived
      # GITHUB_TOKEN on stdin, private Docker config deleted on exit, even on
      # failure. Any failed push fails the step, the job and "Images result".
      - name: Push to GHCR (full-SHA tags only)
        if: needs.publish-policy.outputs.mode == 'on'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ "$TRIVY_EXIT_CODE" = "1" ] || { echo "::error::refused: Trivy is audit-only"; exit 1; }
          DOCKER_CONFIG="$(mktemp -d)"; export DOCKER_CONFIG
          trap 'docker logout ghcr.io > /dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin > /dev/null
          unset REGISTRY_TOKEN
          {
            echo "### GHCR publication"
            echo "| Image | Digest |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for img in $IMAGES; do
            ref="$IMAGE_NAMESPACE/$img:$SHA"
            docker push --quiet "$ref"
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{.}} {{end}}' "$ref")"
            echo "| \`$ref\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Dry-run summary
        if: needs.publish-policy.outputs.mode == 'dry-run'
        run: |
          echo "### GHCR dry-run: 8 scanned images reloaded and verified, nothing pushed" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Single status for the whole pipeline (the future deploy will need it).
  # Fails if CI, Gitleaks or any build failed, was cancelled or was skipped,
  # if the publish policy failed, or if a required publication failed.
  # ---------------------------------------------------------------------------
  images:
    name: Images result
    if: always()
    needs: [ci, gitleaks, build-java, build-frontend, publish-policy, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CI_RESULT: ${{ needs.ci.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          BUILD_RESULT: ${{ needs.build-java.result }}
          FRONTEND_RESULT: ${{ needs.build-frontend.result }}
          POLICY_RESULT: ${{ needs.publish-policy.result }}
          PUBLISH_MODE: ${{ needs.publish-policy.outputs.mode }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          echo "ci=$CI_RESULT gitleaks=$GITLEAKS_RESULT build-java=$BUILD_RESULT build-frontend=$FRONTEND_RESULT"
          echo "publish-policy=$POLICY_RESULT mode=$PUBLISH_MODE publish=$PUBLISH_RESULT"
          if [ "$CI_RESULT" != "success" ]; then
            echo "::error::CI failed on this commit: no image was built"
            exit 1
          fi
          if [ "$GITLEAKS_RESULT" != "success" ]; then
            echo "::error::Gitleaks did not pass on this commit: no image was built"
            exit 1
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::At least one image build failed"
            exit 1
          fi
          if [ "$FRONTEND_RESULT" != "success" ]; then
            echo "::error::The frontend image build or its Trivy scan failed"
            exit 1
          fi
          if [ "$POLICY_RESULT" != "success" ]; then
            echo "::error::GHCR publish policy refused the configuration (see Publish policy)"
            exit 1
          fi
          case "$PUBLISH_MODE" in
            off)
              if [ "$PUBLISH_RESULT" != "skipped" ]; then
                echo "::error::Publication is off but the publish job did not skip"
                exit 1
              fi ;;
            dry-run|on)
              if [ "$PUBLISH_RESULT" != "success" ]; then
                echo "::error::GHCR publication ($PUBLISH_MODE) did not succeed: nothing may be deployed from this commit"
                exit 1
              fi ;;
            *)
              echo "::error::Unknown publication mode [$PUBLISH_MODE]"
              exit 1 ;;
          esac
